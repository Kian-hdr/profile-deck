name: Validate
on:
  pull_request:
  push:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install build-time project generator
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Reject accidental credentials
        run: |
          brew list gitleaks >/dev/null 2>&1 || brew install gitleaks
          gitleaks git --no-banner --redact --log-level error .
          gitleaks dir --no-banner --redact --log-level error .
      - name: Check toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Synthetic unit and service tests
        run: ./script/test.sh
      - name: Build companion
        run: ./script/build_and_run.sh --build
# No signing credentials, account fixtures, publication or live-provider launches.
